<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Elsayed Abdelmoneem - Mobile Application Developer, Flutter, iOS and Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152B"/>
      <stop offset="0.6" stop-color="#0A3D73"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#13B9FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#13B9FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#13B9FD"/>
      <stop offset="1" stop-color="#13B9FD" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="280" rx="16"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:600;letter-spacing:6px;fill:#5FD4FF;animation:rise .9s ease-out .1s backwards}
      .name{font-size:58px;font-weight:800;letter-spacing:.5px;fill:#ffffff;animation:rise .9s ease-out .35s backwards}
      .role{font-size:22px;font-weight:400;letter-spacing:3px;fill:#CFE9FF;animation:rise .9s ease-out .8s backwards}
      .rule{transform-box:fill-box;transform-origin:center;animation:grow 1.1s ease-out .6s backwards}
      .glow{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
      .w1{animation:drift 18s linear infinite}
      .w2{animation:drift 12s linear infinite reverse}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
      @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse class="glow" cx="600" cy="125" rx="430" ry="150" fill="url(#glow)"/>

    <path class="w1" fill="#13B9FD" fill-opacity="0.14"
      d="M0 238 Q150 212 300 238 T600 238 T900 238 T1200 238 T1500 238 T1800 238 V280 H0 Z"/>
    <path class="w2" fill="#ffffff" fill-opacity="0.06"
      d="M0 252 Q150 274 300 252 T600 252 T900 252 T1200 252 T1500 252 T1800 252 V280 H0 Z"/>

    <text class="mono eyebrow" x="600" y="72" text-anchor="middle">FLUTTER · iOS · ANDROID</text>
    <text class="sans name" x="600" y="136" text-anchor="middle">Elsayed Abdelmoneem</text>
    <rect class="rule" x="480" y="158" width="240" height="2" rx="1" fill="url(#line)"/>
    <text class="sans role" x="600" y="195" text-anchor="middle">Mobile Application Developer</text>
  </g>
</svg>
